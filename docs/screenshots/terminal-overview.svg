    <rect x="0" y="0" width="220" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="4" y="4" width="104" height="28" rx="6" fill="#10b981"/>
    <text x="56" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🇮🇳 India (NSE/BSE)</text>
    <text x="162" y="22" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">🇺🇸 US (NASDAQ)</text>

