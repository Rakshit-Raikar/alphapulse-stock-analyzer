      <text x="18" y="92" font-size="12" font-weight="700" fill="#e2e8f0">Retail Store Network Dominance</text>
      <text x="18" y="108" font-size="10" fill="#94a3b8">Omnichannel retail footprint capturing unmatched share in groceries, consumer electronics &amp; fashion.</text>
