    <text x="42" y="22" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">Alpha<tspan fill="#10b981">Pulse</tspan></text>
    <rect x="156" y="6" width="60" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="186" y="20" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">AI PRO</text>
  </g>

  <!-- Market Toggle & Ticker Search -->
