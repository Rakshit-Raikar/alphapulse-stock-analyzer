      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="675" fill="#070b12"/>
  <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360 M 0 420 L 1200 420 M 0 480 L 1200 480 M 0 540 L 1200 540 M 0 600 L 1200 600" stroke="#162238" stroke-width="0.5" opacity="0.4"/>
  <path d="M 120 0 L 120 675 M 240 0 L 240 675 M 360 0 L 360 675 M 480 0 L 480 675 M 600 0 L 600 675 M 720 0 L 720 675 M 840 0 L 840 675 M 960 0 L 960 675 M 1080 0 L 1080 675" stroke="#162238" stroke-width="0.5" opacity="0.4"/>

